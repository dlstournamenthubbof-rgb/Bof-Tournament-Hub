<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premier - Teams</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #090514 100%);
      --card-bg: rgba(30, 27, 75, 0.7);
      --card-border: rgba(168, 85, 247, 0.3);
      --accent-color: #c084fc;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding: 20px 15px; }
    .container { max-width: 480px; margin: 0 auto; }

    .page-header {
      background: var(--card-bg); backdrop-filter: blur(25px);
      border: 1px solid var(--card-border); border-radius: 24px;
      padding: 20px; margin-bottom: 25px; text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 25px rgba(168, 85, 247, 0.2);
    }
    .page-header h2 {
      font-size: 1.3rem; color: #fff; font-weight: 800;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      text-transform: uppercase; letter-spacing: 0.5px;
      text-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
    }
    .page-header h2 i { color: var(--accent-color); filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.6)); }

    .group-box {
      background: rgba(15, 10, 30, 0.8); backdrop-filter: blur(20px);
      border: 1px solid rgba(168, 85, 247, 0.25); border-radius: 18px; padding: 16px; margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
    .group-name { color: var(--accent-color); font-size: 1rem; font-weight: 700; margin-bottom: 12px; border-bottom: 1px solid rgba(168, 85, 247, 0.3); padding-bottom: 6px; }
    .team-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .team-item { background: rgba(30, 27, 75, 0.7); border: 1px solid rgba(168, 85, 247, 0.2); padding: 10px 12px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; color: #fff; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h2><i class="fa-solid fa-shield-cat"></i> Premier Teams</h2>
    </div>

    <div class="group-box">
      <div class="group-name">Participating Districts (20 Teams)</div>
      <div class="team-grid" id="teams-container"></div>
    </div>
  </div>

  <script src="epl-core.js"></script>
  <script>
    const container = document.getElementById('teams-container');
    eplTeams.forEach(team => {
      container.innerHTML += `<div class="team-item">${team}</div>`;
    });
  </script>
</body>
</html>
