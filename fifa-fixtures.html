<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIFA World Cup - Match Fixtures & Results</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #0c1c38 0%, #060a12 100%);
      --card-bg: rgba(20, 30, 50, 0.7);
      --card-border: rgba(56, 189, 248, 0.3);
      --accent-color: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding: 20px 15px; }
    .container { max-width: 480px; margin: 0 auto; }

    .page-header {
      background: var(--card-bg); backdrop-filter: blur(25px);
      border: 1px solid var(--card-border); border-radius: 24px;
      padding: 20px; margin-bottom: 25px; text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 25px rgba(56, 189, 248, 0.2);
    }
    .page-header h2 {
      font-size: 1.3rem; color: #fff; font-weight: 800;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .page-header h2 i { color: var(--accent-color); }

    .section-title {
      color: var(--accent-color); margin: 25px 0 14px 0; font-size: 1rem; font-weight: 700;
      border-bottom: 1px solid rgba(56, 189, 248, 0.3); padding-bottom: 8px;
      display: flex; align-items: center; gap: 8px;
    }

    .match-card-wrapper { margin-bottom: 12px; }
    .match-info { font-size: 0.72rem; color: var(--text-sub); text-align: center; margin-bottom: 5px; font-weight: 600; }
    
    .match-box {
      background: rgba(10, 15, 28, 0.8); backdrop-filter: blur(20px);
      border-radius: 18px; padding: 14px 18px;
      display: flex; justify-content: space-between; align-items: center;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    .team { width: 35%; font-weight: 700; font-size: 0.85rem; color: #fff; }
    
    .score {
      background: linear-gradient(135deg, rgba(5, 10, 20, 0.95), rgba(20, 30, 50, 0.9));
      padding: 8px 16px; border-radius: 12px; font-weight: 800; color: var(--accent-color); font-size: 1rem;
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h2><i class="fa-solid fa-calendar-days"></i> Match Fixtures & Results</h2>
    </div>
    <div id="public-fixtures"></div>
  </div>

  <script src="fifa-core.js"></script>
  <script>
    const container = document.getElementById('public-fixtures');
    let stages = ["Round 1", "Round 2", "Round 3", "Round of 16", "Quarter Final", "Semi Final", "Final"];

    stages.forEach(stage => {
      let matchesInStage = allMatches.filter(m => m.stage === stage);
      if(matchesInStage.length > 0) {
        container.innerHTML += `<div class="section-title"><i class="fa-solid fa-star"></i> ${stage}</div>`;
        
        matchesInStage.forEach(m => {
          container.innerHTML += `
            <div class="match-card-wrapper">
              <div class="match-info">Match #${m.id} ${m.group ? '(' + m.group + ')' : ''}</div>
              <div class="match-box">
                <div class="team" style="text-align: right;">${m.home}</div>
                <div class="score">${m.homeScore !== "" ? m.homeScore : '-'} : ${m.awayScore !== "" ? m.awayScore : '-'}</div>
                <div class="team" style="text-align: left;">${m.away}</div>
              </div>
            </div>
          `;
        });
      }
    });
  </script>
</body>
</html>
