<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AFC Asian Cup - Admin Manage Panel</title>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

  <style>

    :root {
      --bg-gradient:
        radial-gradient(circle at 50% 0%, #0c1c38 0%, #060a12 100%);

      --card-bg: rgba(20, 30, 50, 0.7);
      --card-border: rgba(56, 189, 248, 0.3);

      --primary-color: #38bdf8;
      --accent-color: #38bdf8;

      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 15px;
    }

    .container {
      max-width: 480px;
      margin: auto;
    }

    /* HEADER */

    .admin-header {
      background: var(--card-bg);
      backdrop-filter: blur(25px);

      border: 1px solid var(--card-border);
      border-radius: 24px;

      padding: 20px;
      margin-bottom: 25px;

      text-align: center;

      box-shadow:
        0 15px 35px rgba(0,0,0,0.6),
        0 0 25px rgba(56,189,248,0.2);
    }

    .admin-header h1 {
      font-size: 1.3rem;
      color: #fff;
      font-weight: 800;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      text-transform: uppercase;
    }

    .admin-header h1 i {
      color: var(--accent-color);
    }

    /* ALERT */

    .success-alert {
      background: rgba(16,185,129,0.15);

      border: 1px solid rgba(16,185,129,0.4);

      color: #34d399;

      padding: 11px 14px;

      border-radius: 14px;

      margin-bottom: 20px;

      font-size: 0.8rem;

      display: none;

      text-align: center;

      font-weight: 600;
    }

    /* ACTION BAR */

    .admin-actions-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
    }

    .action-btn {
      flex: 1;

      padding: 10px 7px;

      border-radius: 14px;

      font-size: 0.7rem;

      font-weight: 700;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 5px;

      color: #fff;

      background: rgba(255,255,255,0.05);

      border: 1px solid rgba(255,255,255,0.1);
    }

    .btn-reset {
      color: #f87171;
      border-color: rgba(239,68,68,0.4);
    }

    .btn-export {
      color: #34d399;
      border-color: rgba(16,185,129,0.4);
    }

    .btn-import {
      color: #38bdf8;
      border-color: rgba(56,189,248,0.4);
    }

    /* SECTION */

    .section-box {
      background: rgba(10,15,28,0.8);

      backdrop-filter: blur(20px);

      border:
        1px solid rgba(56,189,248,0.25);

      border-radius: 18px;

      padding: 16px;

      margin-bottom: 25px;
    }

    /* FILTER */

    .filter-tabs {
      display: flex;

      gap: 6px;

      overflow-x: auto;

      padding-bottom: 8px;

      margin-bottom: 15px;

      scrollbar-width: none;
    }

    .filter-tabs::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      background: rgba(255,255,255,0.05);

      border:
        1px solid rgba(56,189,248,0.2);

      color: var(--text-sub);

      padding: 6px 14px;

      border-radius: 14px;

      font-size: 0.72rem;

      font-weight: 600;

      cursor: pointer;

      white-space: nowrap;
    }

    .filter-btn.active {
      background: var(--primary-color);

      color: #0c1c38;

      border-color: transparent;

      font-weight: 700;
    }

    /* MATCH CARD */

    .match-card {

      background: rgba(20,30,50,0.7);

      border:
        1px solid rgba(56,189,248,0.2);

      border-radius: 14px;

      padding: 12px 14px;

      margin-bottom: 12px;

      display: flex;

      flex-direction: column;

      gap: 9px;
    }

    .match-info-top {

      display: flex;

      justify-content: space-between;

      font-size: 0.68rem;

      color: var(--text-sub);

      font-weight: 600;
    }

    .match-middle {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 7px;
    }

    .team-name {

      font-size: 0.8rem;

      font-weight: 700;

      width: 35%;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

      color: #fff;
    }

    .score-inputs-box {

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 6px;

      width: 30%;
    }

    .score-inputs-box input {

      width: 40px;

      height: 40px;

      background: rgba(5,10,20,0.9);

      border:
        1px solid rgba(56,189,248,0.3);

      color: #fff;

      text-align: center;

      border-radius: 10px;

      font-weight: bold;

      font-size: 1rem;

      outline: none;
    }

    .score-inputs-box input:focus {

      border-color:
        var(--accent-color);

      box-shadow:
        0 0 10px rgba(56,189,248,0.4);
    }

    .score-inputs-box span {

      font-weight: bold;

      color: var(--accent-color);
    }

    /* SAVE */

    .save-match-btn {

      width: 100%;

      background:
        linear-gradient(
          135deg,
          #38bdf8,
          #0284c7
        );

      color: #0c1c38;

      border: none;

      padding: 9px;

      border-radius: 10px;

      font-size: 0.75rem;

      font-weight: 800;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 6px;
    }

    .save-match-btn:disabled {

      opacity: 0.6;

      cursor: wait;
    }

    .firebase-status {

      text-align: center;

      font-size: 0.7rem;

      margin-bottom: 15px;

      color: #94a3b8;
    }

  </style>
</head>


<body>

<div class="container">

  <!-- HEADER -->

  <header class="admin-header">

    <h1>
      <i class="fa-solid fa-user-gear"></i>
      AFC Admin Manage
    </h1>

  </header>


  <!-- FIREBASE STATUS -->

  <div id="firebaseStatus"
       class="firebase-status">

    🔄 Firebase connecting...

  </div>


  <!-- ALERT -->

  <div id="alertBox"
       class="success-alert">

    <i class="fa-solid fa-circle-check"></i>
    Score Saved Successfully!

  </div>


  <!-- ACTIONS -->

  <div class="admin-actions-bar">

    <button
      class="action-btn btn-reset"
      onclick="resetTournament()">

      <i class="fa-solid fa-rotate-right"></i>

      Reset

    </button>


    <button
      class="action-btn btn-export"
      onclick="exportTournamentData()">

      <i class="fa-solid fa-download"></i>

      Export

    </button>


    <button
      class="action-btn btn-import"
      onclick="triggerImport()">

      <i class="fa-solid fa-upload"></i>

      Import

    </button>


    <input
      type="file"
      id="importFile"
      style="display:none"
      accept=".json"
      onchange="importTournamentData(event)">

  </div>


  <!-- MATCH SECTION -->

  <div class="section-box">

    <!-- FILTER -->

    <div class="filter-tabs">

      <button
        class="filter-btn active"
        onclick="filterMatches('All',this)">

        All

      </button>


      <button
        class="filter-btn"
        onclick="filterMatches('Round 1',this)">

        Round 1

      </button>


      <button
        class="filter-btn"
        onclick="filterMatches('Round 2',this)">

        Round 2

      </button>


      <button
        class="filter-btn"
        onclick="filterMatches('Round 3',this)">

        Round 3

      </button>


      <button
        class="filter-btn"
        onclick="filterMatches('Quarter Final',this)">

        QF

      </button>


      <button
        class="filter-btn"
        onclick="filterMatches('Semi Final',this)">

        SF

      </button>


      <button
        class="filter-btn"
        onclick="filterMatches('Third Place',this)">

        3rd

      </button>


      <button
        class="filter-btn"
        onclick="filterMatches('Final',this)">

        Final

      </button>

    </div>


    <!-- MATCHES -->

    <div id="admin-fixtures-container">

      <div style="
        text-align:center;
        padding:30px;
        color:#94a3b8;
      ">

        Loading matches...

      </div>

    </div>

  </div>

</div>


<!-- =====================================================
     FIREBASE CORE
===================================================== -->

<script src="afc-core.js"></script>


<script>

let currentFilter = "All";


// =====================================================
// FIREBASE STATUS
// =====================================================

function updateFirebaseStatus() {

  const status =
    document.getElementById(
      "firebaseStatus"
    );

  if (!status) return;


  if (
    typeof firebaseReady !==
    "undefined" &&
    firebaseReady
  ) {

    status.innerHTML =
      "🟢 Firebase Connected";

    status.style.color =
      "#34d399";

  } else {

    status.innerHTML =
      "🟡 Firebase Connecting...";

    status.style.color =
      "#fbbf24";

  }

}


// =====================================================
// RENDER ADMIN MATCHES
// =====================================================

function renderAdminFixtures() {

  const container =
    document.getElementById(
      "admin-fixtures-container"
    );

  if (!container) return;


  container.innerHTML = "";


  if (
    typeof allMatches ===
    "undefined" ||
    !Array.isArray(allMatches)
  ) {

    container.innerHTML = `

      <div style="
        text-align:center;
        padding:30px;
        color:#f87171;
      ">

        ❌ Match data পাওয়া যায়নি

      </div>

    `;

    return;

  }


  let visibleCount = 0;


  allMatches.forEach(
    (match,index) => {

      if (
        currentFilter !== "All" &&
        match.stage !== currentFilter
      ) {

        return;

      }


      visibleCount++;


      container.innerHTML += `

        <div class="match-card">

          <div class="match-info-top">

            <span>

              Match #${match.id}

              ${
                match.group
                ? "(" + match.group + ")"
                : ""
              }

            </span>

            <span style="color:#38bdf8">

              ${match.stage}

            </span>

          </div>


          <div class="match-middle">

            <div
              class="team-name"
              style="text-align:right"
              title="${match.home}"
            >

              ${match.home}

            </div>


            <div class="score-inputs-box">

              <input
                type="number"
                id="hs_${match.id}"
                value="${
                  match.homeScore !== undefined
                  ? match.homeScore
                  : ""
                }"
                min="0"
                inputmode="numeric"
              >


              <span>:</span>


              <input
                type="number"
                id="as_${match.id}"
                value="${
                  match.awayScore !== undefined
                  ? match.awayScore
                  : ""
                }"
                min="0"
                inputmode="numeric"
              >

            </div>


            <div
              class="team-name"
              style="text-align:left"
              title="${match.away}"
            >

              ${match.away}

            </div>

          </div>


          <button
            class="save-match-btn"
            id="save_${match.id}"
            onclick="saveAdminMatch(${match.id})"
          >

            <i class="fa-solid fa-floppy-disk"></i>

            Save Score

          </button>

        </div>

      `;

    }
  );


  if (visibleCount === 0) {

    container.innerHTML = `

      <div style="
        text-align:center;
        padding:30px;
        color:#94a3b8;
      ">

        এই stage-এ কোনো match নেই।

      </div>

    `;

  }


  updateFirebaseStatus();

}


// =====================================================
// SAVE SCORE TO FIREBASE
// =====================================================

function saveAdminMatch(matchId) {

  const match =
    allMatches.find(
      m => Number(m.id) === Number(matchId)
    );


  if (!match) {

    alert("❌ Match পাওয়া যায়নি!");

    return;

  }


  const homeInput =
    document.getElementById(
      `hs_${matchId}`
    );

  const awayInput =
    document.getElementById(
      `as_${matchId}`
    );


  if (!homeInput || !awayInput) {

    alert("❌ Score input পাওয়া যায়নি!");

    return;

  }


  const homeScore =
    homeInput.value.trim();

  const awayScore =
    awayInput.value.trim();


  if (
    homeScore === "" ||
    awayScore === ""
  ) {

    alert(
      "⚠️ দুই দলের score দিন!"
    );

    return;

  }


  if (
    Number(homeScore) < 0 ||
    Number(awayScore) < 0
  ) {

    alert(
      "⚠️ Score 0 বা তার বেশি হতে হবে!"
    );

    return;

  }


  const button =
    document.getElementById(
      `save_${matchId}`
    );


  if (button) {

    button.disabled = true;

    button.innerHTML = `
      <i class="fa-solid fa-spinner fa-spin"></i>
      Saving...
    `;

  }


  // UPDATE MATCH

  match.homeScore =
    homeScore;

  match.awayScore =
    awayScore;


  tournamentData.matches =
    allMatches;


  // UPDATE KNOCKOUT

  if (
    typeof updateKnockoutTeams ===
    "function"
  ) {

    updateKnockoutTeams();

  }


  // SAVE FIREBASE

  if (
    typeof saveToStorage !==
    "function"
  ) {

    alert(
      "❌ afc-core.js-এর saveToStorage পাওয়া যায়নি!"
    );

    if (button) {

      button.disabled = false;

      button.innerHTML = `
        <i class="fa-solid fa-floppy-disk"></i>
        Save Score
      `;

    }

    return;

  }


  saveToStorage()

    .then(() => {

      allMatches =
        tournamentData.matches;


      showAlert(
        "✅ Score Firebase-এ Saved!"
      );


      renderAdminFixtures();

    })

    .catch(error => {

      console.error(
        "Firebase save error:",
        error
      );


      alert(
        "❌ Firebase-এ score save হয়নি!"
      );


      renderAdminFixtures();

    });

}


// =====================================================
// FILTER
// =====================================================

function filterMatches(
  stage,
  btn
) {

  currentFilter = stage;


  document
    .querySelectorAll(
      ".filter-btn"
    )
    .forEach(
      button =>
        button.classList.remove(
          "active"
        )
    );


  if (btn) {

    btn.classList.add(
      "active"
    );

  }


  renderAdminFixtures();

}


// =====================================================
// RESET TOURNAMENT
// =====================================================

function resetTournament() {

  if (
    !confirm(
      "সব score reset করতে চান?"
    )
  ) {

    return;

  }


  if (
    !Array.isArray(allMatches)
  ) {

    alert(
      "Match data পাওয়া যায়নি!"
    );

    return;

  }


  allMatches.forEach(
    match => {

      match.homeScore = "";

      match.awayScore = "";

    }
  );


  tournamentData.matches =
    allMatches;


  if (
    typeof updateKnockoutTeams ===
    "function"
  ) {

    updateKnockoutTeams();

  }


  saveToStorage()

    .then(() => {

      showAlert(
        "✅ Tournament Reset হয়েছে!"
      );

      renderAdminFixtures();

    })

    .catch(error => {

      console.error(error);

      alert(
        "❌ Firebase reset হয়নি!"
      );

    });

}


// =====================================================
// EXPORT
// =====================================================

function exportTournamentData() {

  const data =
    JSON.stringify(
      tournamentData,
      null,
      2
    );


  const blob =
    new Blob(
      [data],
      {
        type:
          "application/json"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href = url;

  a.download =
    "afc_tournament_backup.json";


  document.body.appendChild(a);

  a.click();

  a.remove();


  URL.revokeObjectURL(url);


  showAlert(
    "✅ Tournament Exported!"
  );

}


// =====================================================
// IMPORT BUTTON
// =====================================================

function triggerImport() {

  document
    .getElementById(
      "importFile"
    )
    .click();

}


// =====================================================
// IMPORT DATA
// =====================================================

function importTournamentData(
  event
) {

  const file =
    event.target.files[0];


  if (!file) return;


  const reader =
    new FileReader();


  reader.onload =
    function(e) {

      try {

        const imported =
          JSON.parse(
            e.target.result
          );


        if (
          !imported ||
          !Array.isArray(
            imported.matches
          )
        ) {

          alert(
            "❌ Invalid backup file!"
          );

          return;

        }


        tournamentData =
          imported;


        allMatches =
          tournamentData.matches;


        if (
          typeof updateKnockoutTeams ===
          "function"
        ) {

          updateKnockoutTeams();

        }


        saveToStorage()

          .then(() => {

            renderAdminFixtures();

            showAlert(
              "✅ Data Firebase-এ Imported!"
            );

          })

          .catch(error => {

            console.error(error);

            alert(
              "❌ Firebase import হয়নি!"
            );

          });

      }

      catch(error) {

        console.error(error);

        alert(
          "❌ JSON file পড়া যায়নি!"
        );

      }

    };


  reader.readAsText(
    file,
    "UTF-8"
  );


  event.target.value = "";

}


// =====================================================
// ALERT
// =====================================================

function showAlert(message) {

  const alertBox =
    document.getElementById(
      "alertBox"
    );


  if (!alertBox) return;


  alertBox.innerHTML = `

    <i class="fa-solid fa-circle-check"></i>

    ${message}

  `;


  alertBox.style.display =
    "block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });


  setTimeout(
    () => {

      alertBox.style.display =
        "none";

    },
    2500
  );

}


// =====================================================
// FIREBASE REALTIME UPDATE
// =====================================================

window.addEventListener(
  "afcFirebaseUpdated",
  function() {

    allMatches =
      tournamentData.matches;

    renderAdminFixtures();

    updateFirebaseStatus();

  }
);


// =====================================================
// PAGE LOAD
// =====================================================

document.addEventListener(
  "DOMContentLoaded",
  function() {

    renderAdminFixtures();

    updateFirebaseStatus();

  }
);


// =====================================================
// PERIODIC STATUS CHECK
// =====================================================

setInterval(
  updateFirebaseStatus,
  1000
);

</script>

</body>
</html>
