<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIFA World Cup - Knockout Bracket</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #0c1c38 0%, #060a12 100%);
      --card-bg: rgba(20, 30, 50, 0.85);
      --card-border: rgba(56, 189, 248, 0.3);
      --accent-color: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding: 10px; }
    .container { max-width: 100%; width: 100%; margin: 0 auto; overflow-x: hidden; }

    .page-header {
      background: var(--card-bg); backdrop-filter: blur(25px);
      border: 1px solid var(--card-border); border-radius: 16px;
      padding: 12px; margin-bottom: 15px; text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }
    .page-header h2 {
      font-size: 1.1rem; color: #fff; font-weight: 800;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      text-transform: uppercase;
    }
    .page-header h2 i { color: var(--accent-color); }

    .bracket-scroll-container {
      width: 100%; overflow-x: auto; padding-bottom: 15px;
      -webkit-overflow-scrolling: touch; scrollbar-width: thin;
    }
    .bracket-wrapper { display: flex; min-width: 850px; gap: 15px; align-items: center; justify-content: space-between; padding: 5px; }
    .bracket-side { display: flex; gap: 12px; flex: 1; }
    .round-column { display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .column-title {
      font-size: 0.72rem; font-weight: 700; color: var(--accent-color); text-align: center;
      background: rgba(10, 15, 28, 0.9); padding: 6px 4px; border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .match-card-wrapper { position: relative; }
    .match-info-top { font-size: 0.58rem; color: var(--text-sub); text-align: center; margin-bottom: 2px; font-weight: 600; }
    
    .match-box {
      background: var(--card-bg); backdrop-filter: blur(20px);
      border-radius: 12px; padding: 8px 10px;
      display: flex; justify-content: space-between; align-items: center;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }
    .team { width: 36%; font-weight: 700; font-size: 0.7rem; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    
    .score-box {
      background: linear-gradient(135deg, rgba(5, 10, 20, 0.95), rgba(20, 30, 50, 0.9));
      padding: 4px 8px; border-radius: 6px; font-weight: 800; color: var(--accent-color); font-size: 0.78rem;
      border: 1px solid rgba(56, 189, 248, 0.4);
    }

    .center-bracket {
      width: 220px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
      background: rgba(10, 15, 28, 0.7); padding: 15px 10px; border-radius: 16px;
      border: 1px solid rgba(56, 189, 248, 0.3); flex-shrink: 0;
    }
    .trophy-title { font-size: 0.8rem; font-weight: 800; color: #facc15; letter-spacing: 1px; margin-top: 4px; }
    .sub-section { width: 100%; margin-top: 5px; border-top: 1px dashed rgba(56, 189, 248, 0.3); padding-top: 10px; }
    .sub-title { font-size: 0.65rem; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h2><i class="fa-solid fa-sitemap"></i> Knockout Phase Schedule</h2>
    </div>

    <div class="bracket-scroll-container">
      <div class="bracket-wrapper">
        <div class="bracket-side">
          <div class="round-column">
            <div class="column-title">ROUND OF 16</div>
            <div id="r16-left"></div>
          </div>
          <div class="round-column" style="justify-content: center;">
            <div class="column-title">QUARTER-FINAL</div>
            <div id="qf-left"></div>
            <div class="column-title" style="margin-top: 15px;">SEMIFINAL</div>
            <div id="sf-left"></div>
          </div>
        </div>

        <div class="center-bracket">
          <div class="trophy-box">
            <i class="fa-solid fa-trophy" style="font-size: 45px; color: #facc15;"></i>
            <div class="trophy-title">CHAMPION</div>
          </div>
          
          <div style="width: 100%;">
            <div class="column-title" style="background: linear-gradient(135deg, #38bdf8, #0284c7); color: #0c1c38; font-weight: 800;">FINAL</div>
            <div id="final-match" style="margin-top: 8px;"></div>
          </div>

          <div class="sub-section">
            <div class="sub-title">Bronze Final (Third-place)</div>
            <div id="bronze-match"></div>
          </div>
        </div>

        <div class="bracket-side">
          <div class="round-column" style="justify-content: center;">
            <div class="column-title">QUARTER-FINAL</div>
            <div id="qf-right"></div>
            <div class="column-title" style="margin-top: 15px;">SEMIFINAL</div>
            <div id="sf-right"></div>
          </div>
          <div class="round-column">
            <div class="column-title">ROUND OF 16</div>
            <div id="r16-right"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="fifa-core.js"></script>
  <script>
    function renderMatchHTML(m) {
      if (!m) return '<div class="match-box" style="justify-content:center; color:var(--text-sub); font-size:0.7rem;">TBD</div>';
      return `
        <div class="match-card-wrapper">
          <div class="match-info-top">Match #${m.id}</div>
          <div class="match-box">
            <div class="team" style="text-align: right;" title="${m.home}">${m.home}</div>
            <div class="score-box">${m.homeScore !== "" && m.homeScore !== undefined ? m.homeScore : '-'} : ${m.awayScore !== "" && m.awayScore !== undefined ? m.awayScore : '-'}</div>
            <div class="team" style="text-align: left;" title="${m.away}">${m.away}</div>
          </div>
        </div>
      `;
    }

    const r16Matches = allMatches.filter(m => m.stage === "Round of 16");
    const qfMatches = allMatches.filter(m => m.stage === "Quarter Final");
    const sfMatches = allMatches.filter(m => m.stage === "Semi Final");
    const finalMatch = allMatches.find(m => m.stage === "Final");
    const bronzeMatch = allMatches.find(m => m.stage === "Third Place" || m.stage === "Bronze Final");

    document.getElementById('r16-left').innerHTML = r16Matches.slice(0, 4).map(renderMatchHTML).join('');
    document.getElementById('r16-right').innerHTML = r16Matches.slice(4, 8).map(renderMatchHTML).join('');
    document.getElementById('qf-left').innerHTML = qfMatches.slice(0, 2).map(renderMatchHTML).join('');
    document.getElementById('qf-right').innerHTML = qfMatches.slice(2, 4).map(renderMatchHTML).join('');
    document.getElementById('sf-left').innerHTML = sfMatches.slice(0, 1).map(renderMatchHTML).join('');
    document.getElementById('sf-right').innerHTML = sfMatches.slice(1, 2).map(renderMatchHTML).join('');
    document.getElementById('final-match').innerHTML = renderMatchHTML(finalMatch);
    document.getElementById('bronze-match').innerHTML = renderMatchHTML(bronzeMatch);
  </script>
</body>
</html>
