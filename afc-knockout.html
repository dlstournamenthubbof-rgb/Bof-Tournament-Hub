<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>AFC Asian Cup - Knockout</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
rel="stylesheet">


<style>

/* =====================================================
   ROOT
===================================================== */

:root{

  --bg:#050914;

  --panel:#0c1424;

  --card:#111c2d;

  --card2:#0d1728;

  --border:rgba(56,189,248,.25);

  --blue:#38bdf8;

  --green:#34d399;

  --gold:#facc15;

  --muted:#94a3b8;

  --white:#f8fafc;

}


/* =====================================================
   RESET
===================================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;

  font-family:'Poppins',sans-serif;
}


html,
body{

  width:100%;

  min-height:100%;

  overflow-x:hidden;

}


body{

  background:

    radial-gradient(
      circle at 50% 0%,
      #102442 0%,
      #050914 50%,
      #03060d 100%
    );

  color:var(--white);

  padding:8px;

}


/* =====================================================
   MAIN
===================================================== */

.container{

  width:100%;

  max-width:520px;

  margin:auto;

}


/* =====================================================
   HEADER
===================================================== */

.header{

  background:
    rgba(12,22,39,.92);

  border:
    1px solid
    var(--border);

  border-radius:16px;

  padding:10px;

  text-align:center;

  margin-bottom:8px;

  box-shadow:
    0 8px 20px
    rgba(0,0,0,.5);

}


.header-title{

  font-size:.95rem;

  font-weight:800;

  letter-spacing:.5px;

}


.header-title i{

  color:var(--blue);

  margin-right:5px;

}


.live{

  color:var(--green);

  font-size:.55rem;

  font-weight:700;

  margin-top:1px;

}


/* =====================================================
   SECTION TITLE
===================================================== */

.section-title{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:6px;

  font-size:.65rem;

  font-weight:800;

  color:var(--blue);

  margin:7px 0 5px;

}


.section-title::before,
.section-title::after{

  content:"";

  height:1px;

  background:
    rgba(56,189,248,.25);

  flex:1;

}


/* =====================================================
   QUARTER FINAL
===================================================== */

.qf-grid{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:6px;

}


.match-card{

  background:
    linear-gradient(
      145deg,
      rgba(18,31,52,.97),
      rgba(8,15,27,.98)
    );

  border:
    1px solid
    rgba(56,189,248,.22);

  border-radius:9px;

  padding:6px;

  box-shadow:
    0 5px 12px
    rgba(0,0,0,.35);

}


.match-number{

  text-align:center;

  color:var(--muted);

  font-size:.48rem;

  font-weight:600;

  margin-bottom:3px;

}


.team{

  display:flex;

  align-items:center;

  justify-content:space-between;

  min-height:21px;

  padding:2px 4px;

  border-radius:4px;

}


.team.winner{

  background:
    rgba(52,211,153,.08);

}


.team-name{

  font-size:.57rem;

  font-weight:700;

  max-width:82%;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;

}


.team-name.tbd{

  color:#64748b;

}


.score{

  color:var(--blue);

  font-size:.61rem;

  font-weight:800;

}


.winner .score{

  color:var(--green);

}


/* =====================================================
   SEMI FINAL
===================================================== */

.sf-grid{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;

}


.sf-card{

  background:
    linear-gradient(
      145deg,
      rgba(15,32,50,.98),
      rgba(7,14,25,.98)
    );

  border:
    1px solid
    rgba(56,189,248,.30);

  border-radius:10px;

  padding:7px;

  box-shadow:
    0 5px 15px
    rgba(0,0,0,.4);

}


.sf-card .match-number{

  color:var(--blue);

}


/* =====================================================
   FINAL AREA
===================================================== */

.final-section{

  margin-top:7px;

}


.final-card{

  max-width:310px;

  margin:auto;

  background:

    linear-gradient(
      145deg,
      rgba(48,39,12,.65),
      rgba(13,18,29,.98)
    );

  border:
    1px solid
    rgba(250,204,21,.45);

  border-radius:13px;

  padding:9px;

  box-shadow:
    0 0 22px
    rgba(250,204,21,.08);

}


.final-heading{

  text-align:center;

  color:var(--gold);

  font-size:.65rem;

  font-weight:800;

  letter-spacing:1px;

  margin-bottom:5px;

}


.trophy{

  text-align:center;

  margin-bottom:3px;

}


.trophy i{

  color:var(--gold);

  font-size:25px;

  filter:
    drop-shadow(
      0 0 8px
      rgba(250,204,21,.5)
    );

}


/* =====================================================
   CHAMPION
===================================================== */

.champion{

  max-width:310px;

  margin:6px auto 0;

  padding:6px;

  border-radius:8px;

  background:
    rgba(250,204,21,.07);

  border:
    1px solid
    rgba(250,204,21,.22);

  text-align:center;

}


.champion-label{

  color:var(--gold);

  font-size:.48rem;

  font-weight:700;

}


.champion-name{

  font-size:.72rem;

  font-weight:800;

  margin-top:1px;

}


/* =====================================================
   THIRD PLACE
===================================================== */

.third{

  max-width:310px;

  margin:7px auto 0;

}


.third-title{

  text-align:center;

  color:var(--muted);

  font-size:.5rem;

  font-weight:700;

  margin-bottom:3px;

}


.third .match-card{

  border-color:
    rgba(148,163,184,.20);

}


/* =====================================================
   EMPTY
===================================================== */

.empty{

  text-align:center;

  color:#64748b;

  font-size:.57rem;

  padding:7px;

}


/* =====================================================
   VERY SMALL SCREEN
===================================================== */

@media(max-width:360px){

  body{
    padding:5px;
  }


  .header{
    padding:8px;
  }


  .header-title{
    font-size:.82rem;
  }


  .qf-grid{
    gap:4px;
  }


  .sf-grid{
    gap:6px;
  }


  .match-card,
  .sf-card{
    padding:5px;
  }


  .team-name{
    font-size:.52rem;
  }


  .score{
    font-size:.56rem;
  }

}


/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:700px){

  .container{
    max-width:700px;
  }


  .header-title{
    font-size:1.15rem;
  }


  .qf-grid,
  .sf-grid{
    gap:10px;
  }


  .team-name{
    font-size:.68rem;
  }


  .score{
    font-size:.72rem;
  }

}

</style>

</head>


<body>


<div class="container">


  <!-- =================================================
       HEADER
  ================================================== -->

  <div class="header">

    <div class="header-title">

      <i class="fa-solid fa-trophy"></i>

      AFC ASIAN CUP — KNOCKOUT

    </div>

    <div class="live">

      ● LIVE DATA

    </div>

  </div>



  <!-- =================================================
       QUARTER FINAL
  ================================================== -->

  <div class="section-title">

    QUARTER-FINAL

  </div>


  <div
    id="qf-container"
    class="qf-grid">

  </div>



  <!-- =================================================
       SEMI FINAL
  ================================================== -->

  <div class="section-title">

    SEMI-FINAL

  </div>


  <div
    id="sf-container"
    class="sf-grid">

  </div>



  <!-- =================================================
       FINAL
  ================================================== -->

  <div class="final-section">

    <div class="section-title">

      FINAL

    </div>


    <div class="final-card">

      <div class="trophy">

        <i class="fa-solid fa-trophy"></i>

      </div>


      <div class="final-heading">

        🏆 CHAMPIONSHIP FINAL

      </div>


      <div id="final-container">

      </div>

    </div>


    <!-- CHAMPION -->

    <div id="champion-container">

    </div>


    <!-- THIRD PLACE -->

    <div class="third">

      <div class="third-title">

        THIRD PLACE MATCH

      </div>


      <div id="third-container">

      </div>

    </div>

  </div>


</div>



<!-- =====================================================
     FIREBASE CORE
===================================================== -->

<script src="afc-core.js"></script>


<script>

/* =====================================================
   GET MATCH
===================================================== */

function getMatch(id){

  if(
    typeof allMatches === "undefined" ||
    !Array.isArray(allMatches)
  ){

    return null;

  }


  return allMatches.find(
    m =>
      Number(m.id) === Number(id)
  ) || null;

}


/* =====================================================
   WINNER
===================================================== */

function getWinner(match){

  if(!match){

    return "";

  }


  if(
    match.homeScore === "" ||
    match.awayScore === ""
  ){

    return "";

  }


  const home =
    Number(match.homeScore);


  const away =
    Number(match.awayScore);


  if(home > away){

    return match.home;

  }


  if(away > home){

    return match.away;

  }


  return "";

}


/* =====================================================
   MATCH HTML
===================================================== */

function matchHTML(match){

  if(!match){

    return `

      <div class="match-card">

        <div class="empty">

          TBD

        </div>

      </div>

    `;

  }


  const winner =
    getWinner(match);


  const homeWinner =
    winner === match.home;


  const awayWinner =
    winner === match.away;


  const homeScore =
    match.homeScore === "" ||
    match.homeScore === undefined
      ? "–"
      : match.homeScore;


  const awayScore =
    match.awayScore === "" ||
    match.awayScore === undefined
      ? "–"
      : match.awayScore;


  return `

    <div class="match-card">

      <div class="match-number">

        MATCH #${match.id}

      </div>


      <div
        class="team
        ${homeWinner ? "winner" : ""}">

        <div class="team-name">

          ${match.home || "TBD"}

        </div>


        <div class="score">

          ${homeScore}

        </div>

      </div>


      <div
        class="team
        ${awayWinner ? "winner" : ""}">

        <div class="team-name">

          ${match.away || "TBD"}

        </div>


        <div class="score">

          ${awayScore}

        </div>

      </div>

    </div>

  `;

}


/* =====================================================
   RENDER
===================================================== */

function renderKnockout(){

  if(
    typeof allMatches === "undefined" ||
    !Array.isArray(allMatches)
  ){

    return;

  }


  /* -----------------------------------------------
     QUARTER FINAL
  ------------------------------------------------ */

  const qf1 =
    getMatch(25);

  const qf2 =
    getMatch(26);

  const qf3 =
    getMatch(27);

  const qf4 =
    getMatch(28);


  document.getElementById(
    "qf-container"
  ).innerHTML =

    matchHTML(qf1) +

    matchHTML(qf2) +

    matchHTML(qf3) +

    matchHTML(qf4);



  /* -----------------------------------------------
     SEMI FINAL
  ------------------------------------------------ */

  const sf1 =
    getMatch(29);

  const sf2 =
    getMatch(30);


  document.getElementById(
    "sf-container"
  ).innerHTML =

    matchHTML(sf1) +

    matchHTML(sf2);



  /* -----------------------------------------------
     FINAL
  ------------------------------------------------ */

  const final =
    getMatch(32);


  document.getElementById(
    "final-container"
  ).innerHTML =

    matchHTML(final);



  /* -----------------------------------------------
     THIRD PLACE
  ------------------------------------------------ */

  const third =
    getMatch(31);


  document.getElementById(
    "third-container"
  ).innerHTML =

    matchHTML(third);



  /* -----------------------------------------------
     CHAMPION
  ------------------------------------------------ */

  renderChampion(final);

}


/* =====================================================
   CHAMPION
===================================================== */

function renderChampion(final){

  const container =
    document.getElementById(
      "champion-container"
    );


  if(!container){

    return;

  }


  const winner =
    getWinner(final);


  if(!winner){

    container.innerHTML = "";

    return;

  }


  container.innerHTML = `

    <div class="champion">

      <div class="champion-label">

        🏆 CHAMPION

      </div>


      <div class="champion-name">

        ${winner}

      </div>

    </div>

  `;

}


/* =====================================================
   FIREBASE READY
===================================================== */

window.addEventListener(
  "afcFirebaseReady",
  function(){

    renderKnockout();

  }
);


/* =====================================================
   FIREBASE UPDATED
===================================================== */

window.addEventListener(
  "afcFirebaseUpdated",
  function(){

    renderKnockout();

  }
);


/* =====================================================
   PAGE LOAD
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    renderKnockout();

  }
);


/* =====================================================
   BACKUP REFRESH
===================================================== */

setInterval(
  function(){

    renderKnockout();

  },
  1500
);

</script>


</body>
</html>
