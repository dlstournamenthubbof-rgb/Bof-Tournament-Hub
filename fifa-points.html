<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIFA World Cup - Points Table</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #0c1c38 0%, #060a12 100%);
      --card-bg: rgba(20, 30, 50, 0.7);
      --card-border: rgba(56, 189, 248, 0.3);
      --accent-color: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding: 20px 15px; }
    .container { max-width: 480px; margin: 0 auto; }

    .page-header {
      background: var(--card-bg); backdrop-filter: blur(25px);
      border: 1px solid var(--card-border); border-radius: 24px;
      padding: 20px; margin-bottom: 25px; text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }
    .page-header h2 {
      font-size: 1.3rem; color: #fff; font-weight: 800;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      text-transform: uppercase;
    }
    .page-header h2 i { color: var(--accent-color); }

    .section-title {
      color: var(--accent-color); margin: 25px 0 14px 0; font-size: 1rem; font-weight: 700;
      border-bottom: 1px solid rgba(56, 189, 248, 0.3); padding-bottom: 8px;
      display: flex; align-items: center; gap: 8px;
    }

    .table-box {
      background: rgba(10, 15, 28, 0.8); backdrop-filter: blur(20px);
      border-radius: 18px; padding: 14px; margin-bottom: 15px;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; text-align: center; }
    th, td { padding: 8px 4px; border-bottom: 1px solid rgba(255,255,255,0.05); color: var(--text-main); }
    th { color: var(--text-sub); font-weight: 600; }
    td:nth-child(2) { text-align: left; font-weight: 600; color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h2><i class="fa-solid fa-table-standings"></i> Points Table</h2>
    </div>
    <div id="points-container"></div>
  </div>

  <script src="fifa-core.js"></script>
  <script>
    const container = document.getElementById('points-container');
    const tableData = getCalculatedTable();

    let groups = {
      "Group A": ["Spain", "Argentina", "Uruguay", "Senegal"],
      "Group B": ["France", "England", "Switzerland", "Italy"],
      "Group C": ["Brazil", "Morocco", "USA", "Japan"],
      "Group D": ["Portugal", "Belgium", "Norway", "Colombia"],
      "Group E": ["Netherlands", "Mexico", "Germany", "Croatia"],
      "Group F": ["Sweden", "Austria", "Ukraine", "Serbia"],
      "Group G": ["Turkey", "Cameroon", "Poland", "Scotland"],
      "Group H": ["Canada", "South Korea", "Denmark", "Ecuador"]
    };

    for (let g in groups) {
      let groupTeams = tableData.filter(t => groups[g].includes(t.name));
      
      let html = `
        <div class="section-title"><i class="fa-solid fa-star"></i> ${g}</div>
        <div class="table-box">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th style="text-align: left; padding-left: 5px;">Team</th>
                <th>P</th>
                <th>W</th>
                <th>D</th>
                <th>L</th>
                <th>GD</th>
                <th>Pts</th>
              </tr>
            </thead>
            <tbody>
      `;

      groupTeams.forEach((t, index) => {
        html += `
          <tr>
            <td>0${index + 1}</td>
            <td style="text-align: left; padding-left: 5px;">${t.name}</td>
            <td>${t.played}</td>
            <td>${t.win}</td>
            <td>${t.draw}</td>
            <td>${t.loss}</td>
            <td>${t.gd}</td>
            <td style="font-weight: 800; color: var(--accent-color);">${t.pts}</td>
          </tr>
        `;
      });

      html += `</tbody></table></div>`;
      container.innerHTML += html;
    }
  </script>
</body>
</html>
