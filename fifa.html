<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIFA World Cup - DLS Tournament Hub</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Font: Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #040a16;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(0, 136, 255, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(0, 210, 255, 0.08) 0%, transparent 40%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 15px;
      overflow-x: hidden;
    }

    /* Main Glass Container */
    .app-container {
      width: 100%;
      max-width: 450px;
      background: rgba(10, 22, 44, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 136, 255, 0.2);
      border-radius: 28px;
      padding: 22px 18px 30px 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 136, 255, 0.15);
      animation: fadeIn 0.6s ease-out;
    }

    /* Page Fade-In Keyframe */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Header Navbar */
    .header-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .back-btn {
      width: 42px;
      height: 42px;
      background: rgba(15, 30, 58, 0.8);
      border: 1px solid rgba(0, 136, 255, 0.3);
      border-radius: 12px;
      color: #8da2c0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 16px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .back-btn:hover, .back-btn:active {
      color: #00d2ff;
      border-color: #00d2ff;
      transform: scale(0.95);
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.3);
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-title i {
      color: #ffd700;
      font-size: 18px;
      filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.5));
    }

    .header-title h2 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .live-badge {
      background: rgba(255, 59, 48, 0.15);
      border: 1px solid rgba(255, 59, 48, 0.5);
      color: #ff3b30;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 0 10px rgba(255, 59, 48, 0.2);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background-color: #ff3b30;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Hero Banner Section */
    .hero-section {
      text-align: center;
      background: linear-gradient(135deg, rgba(0, 136, 255, 0.15) 0%, rgba(0, 50, 150, 0.1) 100%);
      border: 1px solid rgba(0, 136, 255, 0.25);
      border-radius: 22px;
      padding: 25px 15px;
      margin-bottom: 25px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .hero-section::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(0, 210, 255, 0.1) 0%, transparent 60%);
      pointer-events: none;
    }

    .hero-welcome {
      font-size: 11px;
      font-weight: 600;
      color: #00d2ff;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .hero-title {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      line-height: 1.2;
      text-shadow: 0 0 15px rgba(0, 136, 255, 0.5);
    }

    .hero-subtitle {
      font-size: 12px;
      color: #8da2c0;
      margin-top: 6px;
      font-weight: 400;
    }

    /* 2x2 Menu Grid */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .menu-card {
      background: linear-gradient(145deg, rgba(16, 33, 65, 0.8), rgba(8, 18, 38, 0.9));
      border: 1px solid rgba(0, 136, 255, 0.2);
      border-radius: 20px;
      padding: 22px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #ffffff;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .menu-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), transparent);
      pointer-events: none;
    }

    /* Hover and Click Animations */
    .menu-card:hover {
      transform: translateY(-5px);
      border-color: rgba(0, 210, 255, 0.5);
      box-shadow: 0 12px 25px rgba(0, 102, 255, 0.35), 0 0 15px rgba(0, 210, 255, 0.2);
    }

    .menu-card:active {
      transform: scale(0.96);
      box-shadow: 0 4px 12px rgba(0, 102, 255, 0.2);
    }

    /* Gradient Icon Boxes */
    .icon-box {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 14px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease;
    }

    .menu-card:hover .icon-box {
      transform: scale(1.1);
    }

    /* Specific Icon Gradients */
    .icon-teams {
      background: linear-gradient(135deg, #0088ff, #0044ff);
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(0, 136, 255, 0.35);
    }

    .icon-fixtures {
      background: linear-gradient(135deg, #00d2ff, #0088ff);
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(0, 210, 255, 0.35);
    }

    .icon-points {
      background: linear-gradient(135deg, #7b2cbf, #3a0ca3);
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(123, 44, 191, 0.35);
    }

    .icon-knockout {
      background: linear-gradient(135deg, #ff9f1c, #ffbf00);
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(255, 159, 28, 0.35);
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-align: center;
    }

    /* Footer Branding */
    .footer-text {
      text-align: center;
      margin-top: 30px;
      font-size: 11px;
      color: #5c7294;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Top Header -->
    <header class="header-nav">
      <a href="index.html" class="back-btn" title="Back to Home">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <div class="header-title">
        <i class="fa-solid fa-trophy"></i>
        <h2>FIFA World Cup</h2>
      </div>
      <div class="live-badge">
        <span class="live-dot"></span>
        <span>LIVE</span>
      </div>
    </header>

    <!-- Hero Banner -->
    <section class="hero-section">
      <p class="hero-welcome">Welcome To</p>
      <h1 class="hero-title">FIFA WORLD CUP</h1>
      <p class="hero-subtitle">Official Tournament Hub</p>
    </section>

    <!-- 2x2 Main Grid Menu -->
    <main class="menu-grid">
      
      <!-- 1. Teams -->
      <a href="fifa-teams.html" class="menu-card">
        <div class="icon-box icon-teams">
          <i class="fa-solid fa-users"></i>
        </div>
        <span class="card-title">Teams</span>
      </a>

      <!-- 2. Fixtures -->
      <a href="fifa-fixtures.html" class="menu-card">
        <div class="icon-box icon-fixtures">
          <i class="fa-solid fa-calendar-days"></i>
        </div>
        <span class="card-title">Fixtures</span>
      </a>

      <!-- 3. Points Table -->
      <a href="fifa-points.html" class="menu-card">
        <div class="icon-box icon-points">
          <i class="fa-solid fa-list-ol"></i>
        </div>
        <span class="card-title">Points Table</span>
      </a>

      <!-- 4. Knockout -->
      <a href="fifa-knockout.html" class="menu-card">
        <div class="icon-box icon-knockout">
          <i class="fa-solid fa-trophy"></i>
        </div>
        <span class="card-title">Knockout</span>
      </a>

    </main>

    <!-- Footer -->
    <footer class="footer-text">
      DLS TOURNAMENT HUB • 2026 EDITION
    </footer>

  </div>

  <script>
    // Ripple Effect on Card Click
    document.querySelectorAll('.menu-card').forEach(card => {
      card.addEventListener('click', function(e) {
        // Smooth feedback interaction
        this.style.transform = 'scale(0.95)';
      });
    });
  </script>
</body>
</html>
