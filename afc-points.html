<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AFC Asian Cup - Points Table</title>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

  <style>

    :root {
      --bg-gradient:
        radial-gradient(circle at 50% 0%, #0c1c38 0%, #060a12 100%);

      --card-bg: rgba(20, 30, 50, 0.7);
      --card-border: rgba(56, 189, 248, 0.3);

      --accent-color: #38bdf8;

      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 15px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    .page-header {
      background: var(--card-bg);
      backdrop-filter: blur(25px);

      border: 1px solid var(--card-border);
      border-radius: 24px;

      padding: 20px;
      margin-bottom: 25px;

      text-align: center;

      box-shadow:
        0 15px 35px rgba(0,0,0,0.6),
        0 0 25px rgba(56,189,248,0.2);
    }

    .page-header h2 {
      font-size: 1.3rem;
      color: #fff;
      font-weight: 800;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 10px;

      text-transform: uppercase;
      letter-spacing: 0.5px;

      text-shadow:
        0 0 12px rgba(56,189,248,0.4);
    }

    .page-header h2 i {
      color: var(--accent-color);

      filter:
        drop-shadow(0 0 10px rgba(56,189,248,0.6));
    }

    .loading {
      text-align: center;
      color: var(--text-sub);
      padding: 30px;
      font-size: 0.85rem;
    }

    .group-section {
      background: rgba(10, 15, 28, 0.8);

      backdrop-filter: blur(20px);

      border:
        1px solid rgba(56,189,248,0.25);

      border-radius: 18px;

      padding: 14px;
      margin-bottom: 20px;

      box-shadow:
        0 8px 25px rgba(0,0,0,0.5);
    }

    .group-title {
      color: var(--accent-color);

      font-size: 0.95rem;
      font-weight: 700;

      margin-bottom: 10px;

      border-bottom:
        1px solid rgba(56,189,248,0.3);

      padding-bottom: 6px;

      display: flex;
      align-items: center;
      gap: 8px;
    }

    .group-title i {
      font-size: 0.85rem;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;

      font-size: 0.72rem;
      text-align: center;
    }

    th {
      background:
        rgba(56,189,248,0.15);

      color: var(--accent-color);

      padding: 8px 4px;

      font-weight: 700;
    }

    th:nth-child(2) {
      text-align: left;
    }

    td {
      padding: 8px 4px;

      border-bottom:
        1px solid rgba(255,255,255,0.05);

      color: #fff;

      font-weight: 500;
    }

    td:nth-child(2) {
      text-align: left;
      font-weight: 600;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .qualified {
      background:
        rgba(56,189,248,0.08);
    }

    .position {
      font-weight: 800;
    }

    .points {
      color: #38bdf8;
      font-weight: 800;
    }

    .update-status {
      text-align: center;
      color: #34d399;

      font-size: 0.7rem;

      margin-top: -15px;
      margin-bottom: 20px;
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="page-header">
      <h2>
        <i class="fa-solid fa-ranking-star"></i>
        Points Table
      </h2>
    </div>

    <div id="update-status"
         class="update-status">
      Connecting to Firebase...
    </div>

    <div id="points-container">
      <div class="loading">
        <i class="fa-solid fa-spinner fa-spin"></i>
        Loading points table...
      </div>
    </div>

  </div>


  <!-- Firebase/Core -->
  <script src="afc-core.js"></script>


  <script>

    // =====================================================
    // AFC GROUPS
    // EXACT SAME NAMES AS afc-core.js
    // =====================================================

    const groups = {

      "GROUP A": [
        "Australia",
        "Iran",
        "Jordan",
        "Uzbekistan"
      ],

      "GROUP B": [
        "BANGLADESH",
        "Oman",
        "Qatar",
        "United Arab Emirates (UAE)"
      ],

      "GROUP C": [
        "Bahrain",
        "Iraq",
        "Japan",
        "Thailand"
      ],

      "GROUP D": [
        "Indonesia",
        "Saudi Arabia",
        "South Korea",
        "Vietnam"
      ]

    };


    // =====================================================
    // CALCULATE STANDINGS
    // =====================================================

    function calculateStandings() {

      let standings = {};


      // -----------------------------
      // CREATE TEAMS
      // -----------------------------

      Object.keys(groups).forEach(group => {

        standings[group] = {};

        groups[group].forEach(team => {

          standings[group][team] = {

            played: 0,

            won: 0,

            drawn: 0,

            lost: 0,

            gf: 0,

            ga: 0,

            gd: 0,

            pts: 0

          };

        });

      });


      // -----------------------------
      // READ MATCH RESULTS
      // -----------------------------

      if (
        typeof allMatches === "undefined" ||
        !Array.isArray(allMatches)
      ) {

        return standings;

      }


      allMatches.forEach(match => {

        if (!match) return;


        // Only group matches
        if (
          !match.group ||
          !standings[match.group]
        ) {

          return;

        }


        // Score must exist
        if (
          match.homeScore === "" ||
          match.awayScore === ""
        ) {

          return;

        }


        if (
          isNaN(match.homeScore) ||
          isNaN(match.awayScore)
        ) {

          return;

        }


        const hs =
          parseInt(match.homeScore, 10);

        const as =
          parseInt(match.awayScore, 10);


        const home = match.home;
        const away = match.away;


        // Team check
        if (
          !standings[match.group][home] ||
          !standings[match.group][away]
        ) {

          console.warn(
            "Team not found:",
            match.group,
            home,
            away
          );

          return;

        }


        // -----------------------------
        // PLAYED
        // -----------------------------

        standings[match.group][home].played++;

        standings[match.group][away].played++;


        // -----------------------------
        // GOALS
        // -----------------------------

        standings[match.group][home].gf += hs;

        standings[match.group][home].ga += as;

        standings[match.group][away].gf += as;

        standings[match.group][away].ga += hs;


        // -----------------------------
        // RESULT
        // -----------------------------

        if (hs > as) {

          standings[match.group][home].won++;

          standings[match.group][home].pts += 3;

          standings[match.group][away].lost++;

        }

        else if (hs < as) {

          standings[match.group][away].won++;

          standings[match.group][away].pts += 3;

          standings[match.group][home].lost++;

        }

        else {

          standings[match.group][home].drawn++;

          standings[match.group][away].drawn++;

          standings[match.group][home].pts++;

          standings[match.group][away].pts++;

        }

      });


      // -----------------------------
      // GOAL DIFFERENCE
      // -----------------------------

      Object.keys(standings).forEach(group => {

        Object.keys(standings[group]).forEach(team => {

          standings[group][team].gd =
            standings[group][team].gf -
            standings[group][team].ga;

        });

      });


      return standings;

    }


    // =====================================================
    // RENDER TABLE
    // =====================================================

    function renderPointsTable() {

      const container =
        document.getElementById(
          "points-container"
        );

      if (!container) return;


      container.innerHTML = "";


      const standings =
        calculateStandings();


      Object.keys(groups).forEach(groupName => {

        let teams =
          Object.keys(
            standings[groupName]
          );


        // -----------------------------
        // SORT
        // -----------------------------

        teams.sort((a, b) => {

          const A =
            standings[groupName][a];

          const B =
            standings[groupName][b];


          // Points
          if (B.pts !== A.pts) {

            return B.pts - A.pts;

          }


          // Goal Difference
          if (B.gd !== A.gd) {

            return B.gd - A.gd;

          }


          // Goals For
          if (B.gf !== A.gf) {

            return B.gf - A.gf;

          }


          // Alphabetical fallback
          return a.localeCompare(b);

        });


        let rowsHTML = "";


        // -----------------------------
        // CREATE ROWS
        // -----------------------------

        teams.forEach((team, index) => {

          const t =
            standings[groupName][team];


          const gd =
            t.gd > 0
              ? "+" + t.gd
              : t.gd;


          rowsHTML += `

            <tr class="${index < 2 ? 'qualified' : ''}">

              <td class="position">
                ${index + 1}
              </td>

              <td>
                ${team}
              </td>

              <td>
                ${t.played}
              </td>

              <td>
                ${t.won}
              </td>

              <td>
                ${t.drawn}
              </td>

              <td>
                ${t.lost}
              </td>

              <td>
                ${gd}
              </td>

              <td class="points">
                ${t.pts}
              </td>

            </tr>

          `;

        });


        // -----------------------------
        // GROUP HTML
        // -----------------------------

        container.innerHTML += `

          <div class="group-section">

            <div class="group-title">

              <i class="fa-solid fa-shield-halved"></i>

              ${groupName}

            </div>


            <div class="table-wrapper">

              <table>

                <thead>

                  <tr>

                    <th>#</th>

                    <th>Team</th>

                    <th>P</th>

                    <th>W</th>

                    <th>D</th>

                    <th>L</th>

                    <th>GD</th>

                    <th>Pts</th>

                  </tr>

                </thead>


                <tbody>

                  ${rowsHTML}

                </tbody>

              </table>

            </div>

          </div>

        `;

      });


      // Status
      const status =
        document.getElementById(
          "update-status"
        );

      if (status) {

        status.innerHTML =
          '<i class="fa-solid fa-circle-check"></i> Live • Firebase Connected';

      }

    }


    // =====================================================
    // WAIT FOR PAGE
    // =====================================================

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        // Initial render
        setTimeout(() => {

          renderPointsTable();

        }, 500);

      }
    );


    // =====================================================
    // FIREBASE REALTIME UPDATE
    // =====================================================

    window.addEventListener(
      "afcFirebaseUpdated",
      function(event) {

        console.log(
          "Firebase updated → refreshing Points Table"
        );


        renderPointsTable();

      }
    );


    // =====================================================
    // EXTRA SAFETY REFRESH
    // =====================================================

    setInterval(
      function() {

        if (
          typeof allMatches !== "undefined"
        ) {

          renderPointsTable();

        }

      },
      5000
    );

  </script>

</body>
</html>
